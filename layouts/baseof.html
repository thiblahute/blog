<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ "index.xml" | absURL }}">
<link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
<header><div class="wrap"><a class="site" href="{{ "/" | relURL }}">{{ site.Title }}</a>
<nav><a href="{{ "index.xml" | relURL }}">RSS</a> <a href="https://github.com/thiblahute">GitHub</a> <a href="https://gitlab.freedesktop.org/thiblahute">GitLab</a></nav></div></header>
<main class="wrap">{{ block "main" . }}{{ end }}</main>
<footer><div class="wrap">&copy; Thibault Saunier. Posts from earlier blogs (GNOME, Blogger) are kept under their original dates.</div></footer>
</body>
</html>
